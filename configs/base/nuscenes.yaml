schema_version: 1

data:
  dataset: nuscenes
  root: data/nuScenes
  train_info: nuscenes_infos_train_10sweeps_past9.pkl
  val_info: nuscenes_infos_val_10sweeps_past9.pkl
  split: train
  num_workers: 4
  use_cbgs: false
  key_idxes: [-2, -4, -6, -8]

geometry:
  point_cloud_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]
  lidar_voxel_size: [0.1, 0.1, 0.2]
  bev_output_stride: 8

classes:
  names:
    - car
    - truck
    - construction_vehicle
    - bus
    - trailer
    - barrier
    - motorcycle
    - bicycle
    - pedestrian
    - traffic_cone
  tasks:
    - [car]
    - [truck, construction_vehicle]
    - [bus, trailer]
    - [barrier]
    - [motorcycle, bicycle]
    - [pedestrian, traffic_cone]
