_base_: b1_center_proposal_no_official_range.yaml

experiment:
  name: b1_center_score_blend_no_official_range
  description: >-
    Remove the official GT range gate and draw fixed-size Gaussians at
    proposal*(1-score) + GT*score centers.

region:
  scaler:
    type: inverse_score_center_only

runtime:
  output_dir: outputs/b1_center_score_blend_no_official_range
