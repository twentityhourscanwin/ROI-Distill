_base_:
  - ../base/nuscenes.yaml
  - ../base/student_r50_128x128.yaml
  - ../base/teacher_centerpoint_vox01.yaml
  - ../base/distillation_center_value.yaml

experiment:
  name: b1_teacher_value_no_scale
  seed: 0
  description: >-
    Main baseline: exact-class teacher value on original GT circular Gaussian
    regions, with max overlap and no adaptive scaling.

teacher:
  checkpoint: >-
    ckpts/centerpoint_vox01_128x128_20e_10sweeps.pth
  checkpoint_prefix: "model.centerpoint."

runtime:
  gpus: 16
  num_nodes: 1
  distributed_backend: gloo
  batch_size_per_device: 16
  accumulate_grad_batches: 1
  max_epochs: 24
  precision: "16"
  gradient_clip_val: 35.0
  deterministic: true
  output_dir: outputs/b1_teacher_value_no_scale
  resume_from: null

ema:
  enabled: true

checkpoint:
  save_top_k: 3
  save_last: true
  every_n_epochs: 1

optimizer:
  type: AdamW
  # The standard 16x16 run has global batch 256 and resolves to lr=4e-4.
  base_lr_at_global_batch_64: 0.0001
  weight_decay: 0.01
  backbone_lr_mult: 1.0

scheduler:
  type: MultiStepLR
  milestones: [19, 23]
  warmup_steps: 200
  warmup_ratio: 0.001
  gamma: 0.1
