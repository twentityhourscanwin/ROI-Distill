_base_:
  - ../base/nuscenes.yaml
  - ../base/student_r50_128x128.yaml
  - ../base/teacher_centerpoint_vox01.yaml
  - ../base/distillation_center_value.yaml

experiment:
  name: center_value_baseline_legacy_alias
  seed: 0
  description: >-
    Exact-class, scale-conditioned, score-first one-to-one CenterPoint
    Legacy compatibility alias for B2. New experiments should use the explicit
    B0/B1/B2/B1T entries.

teacher:
  checkpoint: ckpts/centerpoint_vox01_128x128_20e_10sweeps.pth

region:
  scaler:
    enabled: true

runtime:
  gpus: 2
  num_nodes: 1
  distributed_backend: gloo
  batch_size_per_device: 16
  accumulate_grad_batches: 1
  max_epochs: 24
  precision: "16"
  gradient_clip_val: 35.0
  deterministic: true
  output_dir: outputs/center_value_baseline_cp50200
  resume_from: null

ema:
  enabled: true

checkpoint:
  save_top_k: 3
  save_last: true
  every_n_epochs: 1

optimizer:
  type: AdamW
  base_lr_at_global_batch_64: 0.0004
  weight_decay: 0.01
  backbone_lr_mult: 0.5

scheduler:
  type: MultiStepLR
  milestones: [19, 23]
