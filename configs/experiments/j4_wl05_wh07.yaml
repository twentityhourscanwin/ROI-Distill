_base_:
  - ../base/nuscenes.yaml
  - ../base/student_r50_128x128.yaml
  - ../base/teacher_centerpoint_vox01.yaml
  - ../base/distillation_roi_v3.yaml

experiment:
  name: j4_wl05_wh07
  seed: 0
  description: >-
    R50 128x128 LiDAR distillation baseline with structured proposals and
    quality-aware ROI mask. The legacy Python filename says wh08 but its
    effective w_h is 0.7.
  legacy_aliases: [param_J4_wl05_wh08]

runtime:
  gpus: 2
  num_nodes: 1
  batch_size_per_device: 16
  max_epochs: 24
  precision: "16"
  gradient_clip_val: 35.0
  output_dir: outputs/j4_wl05_wh07
  resume_from: null

optimizer:
  type: AdamW
  base_lr_at_global_batch_64: 0.0004
  weight_decay: 0.01
  backbone_lr_mult: 0.5

scheduler:
  type: MultiStepLR
  milestones: [19, 23]
