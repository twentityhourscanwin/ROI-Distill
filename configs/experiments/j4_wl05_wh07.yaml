_base_:
  - ../base/nuscenes.yaml
  - ../base/student_r50_128x128.yaml
  - ../base/teacher_centerpoint_vox01.yaml
  - ../base/distillation_roi_v3.yaml

experiment:
  name: j4_wl05_wh07
  seed: 0
  description: >-
    R50 128x128 LiDAR distillation baseline with structured proposals and
    quality-aware ROI mask. The legacy Python filename says wh08 but its
    effective w_h is 0.7.
  legacy_aliases: [param_J4_wl05_wh08]

runtime:
  gpus: 16
  num_nodes: 1
  # The current DSW PPU runtime uses torch.distributed Gloo; NVIDIA jobs may
  # override this with runtime.distributed_backend=nccl.
  distributed_backend: gloo
  batch_size_per_device: 16
  accumulate_grad_batches: 1
  max_epochs: 24
  precision: "16"
  gradient_clip_val: 35.0
  deterministic: true
  output_dir: outputs/j4_wl05_wh07
  resume_from: null

ema:
  enabled: true

checkpoint:
  save_top_k: 3
  save_last: true
  every_n_epochs: 1

optimizer:
  type: AdamW
  base_lr_at_global_batch_64: 0.0001
  weight_decay: 0.01
  backbone_lr_mult: 1.0

scheduler:
  type: MultiStepLR
  milestones: [19, 23]
  warmup_steps: 200
  warmup_ratio: 0.001
  gamma: 0.1
  min_lr_ratio: 0.0
